<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widget preview</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
    main { max-width: 680px; margin: 0 auto; padding: 64px 20px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: #6e6e73; line-height: 1.6; }
    code { background: #fff; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Widget preview</h1>
    <p>This page stands in for a customer's website. The chat button in the corner is exactly what visitors see.</p>
    <p id="hint"></p>
  </main>
  <script>
    // Loads the widget for ?agent=ID (the dashboard links here with the agent filled in).
    (function () {
      var id = new URLSearchParams(location.search).get('agent')
      if (!id) { document.getElementById('hint').textContent = 'Add ?agent=AGENT_ID to the address to preview an agent.'; return }
      var s = document.createElement('script')
      s.src = '/widget.js'
      s.setAttribute('data-agent', id)
      s.async = true
      document.body.appendChild(s)
    })()
  </script>
</body>
</html>
