server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/v1/voice/ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 16m; }
  location /health { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
