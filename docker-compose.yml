services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voicecare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicecare}
      POSTGRES_DB: voicecare
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecare"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voicecare:${POSTGRES_PASSWORD:-voicecare}@postgres:5432/voicecare
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:8080"]'
      # Trust X-Forwarded-For from the nginx container (backend port is bound to localhost only).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:8000:8000"]  # not public: callers must come through nginx
  frontend:
    build: { context: ., dockerfile: infrastructure/docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
